name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p cap
          cd cap
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp ../index.html ../manifest.json ../icon-192.png ../icon-512.png ../icon-maskable-512.png www/
          npx cap init FingerDraw com.fingerdraw.app --web-dir www

      - name: Bundle MediaPipe model (works offline)
        run: |
          cd cap
          npm pack @mediapipe/hands@0.4.1675469240
          mkdir -p www/mediapipe
          tar xzf mediapipe-hands-0.4.1675469240.tgz -C www/mediapipe --strip-components=1
          ls -la www/mediapipe

      - name: Add Android platform
        run: |
          cd cap
          npx cap add android
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp www/icon-192.png {} \;
          sed -i 's#<string name="\(app_name\|title_activity_main\)">.*</string>#<string name="\1">نقاشی انگشتی</string>#' android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build debug APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FingerDraw-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: FingerDraw APK ${{ github.run_number }}
          files: cap/android/app/build/outputs/apk/debug/app-debug.apk
