name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.eight8.airdraw

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # -----------------------------
      # Create Capacitor project
      # -----------------------------
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          mkdir -p cap
          cd cap

          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/share@7 \
            @capacitor/filesystem@7 \
            @capacitor/app-launcher@7

          mkdir -p www

          cp ../index.html www/
          cp ../manifest.json www/
          cp ../icon-192.png www/
          cp ../icon-512.png www/
          cp ../icon-maskable-512.png www/

          npx cap init FingerDraw "$APP_ID" --web-dir www

      # -----------------------------
      # MediaPipe
      # -----------------------------
      - name: Bundle MediaPipe
        shell: bash
        run: |
          set -e

          cd cap

          npm pack @mediapipe/hands@0.4.1675469240

          mkdir -p www/mediapipe

          tar xzf mediapipe-hands-0.4.1675469240.tgz \
            -C www/mediapipe \
            --strip-components=1

          ls -la www/mediapipe

      # -----------------------------
      # Persian font
      # -----------------------------
      - name: Bundle Persian font
        shell: bash
        run: |
          set -e

          cd cap

          mkdir -p www/fonts
          mkdir -p fontpkg

          (
            cd fontpkg
            npm pack vazirmatn >/dev/null 2>&1
            tar xzf vazirmatn-*.tgz
          ) || true

          f=$(find fontpkg -iname '*.woff2' | grep -i 'wght' | head -1) || true

          if [ -n "$f" ]; then
            cp "$f" www/fonts/Vazirmatn.woff2
            echo "Font installed: $f"
          else
            echo "Font not found, using system font"
          fi

      # -----------------------------
      # Android
      # -----------------------------
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          cd cap

          npx cap add android

          # Camera permission
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' \
            android/app/src/main/AndroidManifest.xml

          # App icon
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          find android/app/src/main/res \
            -name 'ic_launcher*.png' \
            -exec cp www/icon-192.png {} \;

          # App name
          sed -i 's#<string name="\(app_name\|title_activity_main\)">.*</string>#<string name="\1">نقاشی انگشتی</string>#' \
            android/app/src/main/res/values/strings.xml

          # Version
          sed -i \
            "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; \
             s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" \
            android/app/build.gradle || true

          echo "Android configuration:"
          grep -nE "versionCode|versionName|applicationId" \
            android/app/build.gradle || true

          npx cap sync android

      # -----------------------------
      # Create / restore signing key
      # -----------------------------
      - name: Prepare signing key
        if: env.SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -e

          mkdir -p signing

          if [ -f signing/release.jks.enc ]; then

            echo "Using existing encrypted signing key"

            openssl enc -d \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 600000 \
              -in signing/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" \
              -pass env:SIGNING_PASSWORD

          else

            echo "Creating new signing key"

            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storetype PKCS12 \
              -alias airdraw \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SIGNING_PASSWORD" \
              -keypass "$SIGNING_PASSWORD" \
              -dname "CN=Eight8, O=Eight8, C=IR"

            echo "Encrypting signing key"

            openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 600000 \
              -salt \
              -in "$RUNNER_TEMP/release.jks" \
              -out signing/release.jks.enc \
              -pass env:SIGNING_PASSWORD

            git config user.name "github-actions"
            git config user.email "actions@github.com"

            git add signing/release.jks.enc

            git commit -m "Add encrypted release signing key"

            git push origin HEAD:${{ github.ref_name }}

          fi

      # -----------------------------
      # Build RELEASE APK
      # -----------------------------
      - name: Build signed release APK
        if: env.SIGNING_PASSWORD != ''
        shell: bash
        run: |
          set -e

          cd cap/android

          chmod +x gradlew

          echo "Building Release APK..."

          ./gradlew assembleRelease --no-daemon

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not created!"
            exit 1
          fi

          # Find latest Android Build Tools
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "Using Build Tools: $BT"

          # Zipalign
          "$BT/zipalign" \
            -p \
            -f \
            4 \
            "$APK" \
            "$RUNNER_TEMP/aligned.apk"

          # Sign APK
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --ks-key-alias airdraw \
            --out "$GITHUB_WORKSPACE/AirDraw-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          # Verify signature
          "$BT/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/AirDraw-release.apk"

          echo "======================================"
          echo "SIGNED RELEASE APK CREATED"
          echo "======================================"

      # -----------------------------
      # If password is missing
      # -----------------------------
      - name: Stop if signing password is missing
        if: env.SIGNING_PASSWORD == ''
        shell: bash
        run: |
          echo "ERROR: SIGNING_PASSWORD secret is not configured."
          echo ""
          echo "Go to:"
          echo "Settings -> Secrets and variables -> Actions"
          echo ""
          echo "Create:"
          echo "SIGNING_PASSWORD"
          exit 1

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDraw-Release
          path: AirDraw-release.apk

      # -----------------------------
      # GitHub Release
      # -----------------------------
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AirDraw Release ${{ github.run_number }}
          files: AirDraw-release.
